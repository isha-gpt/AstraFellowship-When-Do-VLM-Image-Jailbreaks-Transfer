program: optimize_jailbreak_attacks_against_vlms.py
project: universal-vlm-jailbreak
method: grid
parameters:
  compile:
    values:
      [False]
  data:
    parameters:
      batch_size:
        values:
          [2]
      dataset:
        values:
          [
            "advbench",
            #"rylan_anthropic_hhh",
          ]
      num_workers:
        values:
          [1]
      prefetch_factor:
        values: [ 4 ]
      split:
        values:
          [ "train" ]
  image_kwargs:
    parameters:
      image_size:
        values:
          [512]
      image_initialization:
        values:
          ["trina"]
      patch_size:
        values:
          [5, 10, 15, 20]
  lightning_kwargs:
    parameters:
      accumulate_grad_batches:
        values:
          [4]
      gradient_clip_val:
        values:
          [10.0]
      limit_train_batches:
        values:
          [1.0]
      log_loss_every_n_steps:
        values:
          [1]
      log_image_every_n_steps:
        values:
          [1000]
      precision:
        values:
          ["bf16-mixed"]
  models_to_attack:
    values:
      [
        "{'prism-gemma-instruct+2b+siglip', 'prism-llama3-instruct+8b+dinosiglip'}"
      ]
  n_generations:
    values:
      [ 30 ]
  n_grad_steps:
    values:
      [25000]
  optimization:
    parameters:
      eps:
        values:
          [0.0001]
      learning_rate:
        values:
          [0.001]
      momentum:
        values:
          [0.9]
      optimizer:
        values:
          ["adam"]
      weight_decay:
        values:
          [0.00001]
  seed:
    values:
      [0, 1, 2]